shoutbox:
  shoutbox_enabled:
    default: true
    client: true
  shoutbox_anonymous_view:
    default: true
    depends_on:
      - "shoutbox_enabled"
  shoutbox_sidebar_link:
    default: true
    client: true
    depends_on:
      - "shoutbox_enabled"
  shoutbox_homepage_panel:
    default: true
    client: true
    depends_on:
      - "shoutbox_enabled"
  shoutbox_min_trust_level:
    default: 0
    enum: "TrustLevelSetting"
    depends_on:
      - "shoutbox_enabled"
  shoutbox_max_length:
    default: 200
    min: 20
    max: 500
    depends_on:
      - "shoutbox_enabled"
  shoutbox_messages_displayed:
    default: 30
    min: 10
    max: 100
    depends_on:
      - "shoutbox_enabled"
  shoutbox_max_stored:
    default: 1000
    min: 100
    max: 100000
    depends_on:
      - "shoutbox_enabled"
  shoutbox_rate_limit_per_minute:
    default: 5
    min: 1
    max: 60
    depends_on:
      - "shoutbox_enabled"
